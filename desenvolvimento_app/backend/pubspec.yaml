name: summit_backend
description: API REST da plataforma de doação de alimentos (Dart Frog + MySQL 8.4).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

# Não rode "dart pub upgrade --major-versions" sem combinar com o grupo:
# o pubspec.lock versionado garante as MESMAS versões em todas as máquinas.
dependencies:
  bcrypt: ^1.1.3              # hash de senha
  dart_frog: ^1.1.0           # framework HTTP (rotas por arquivo)
  dart_jsonwebtoken: ^2.14.0  # tokens JWT
  dotenv: ^4.2.0              # lê o arquivo .env
  http: ^1.2.2                # consulta à BrasilAPI (CNPJ)
  mysql_client: ^0.0.27       # driver MySQL (pool + TLS)
  shared_models:
    path: ../shared_models

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
